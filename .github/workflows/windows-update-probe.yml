name: Windows NSIS path reproduction
on:
  push:
    branches: [codex/windows-update-diagnostics-20260920]
    paths:
      - scripts/probe-nsis-paths.mjs
      - scripts/test-windows-upgrade-fixture.mjs
      - build/installer.nsh
      - build/windows-long-path.nsh
      - patches/app-builder-lib+26.15.3.patch
      - .github/workflows/windows-update-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/probe-nsis-paths.mjs
      - run: node scripts/test-windows-upgrade-fixture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsis-path-results
          path: |
            nsis-path-results.json
            windows-upgrade-evidence/
          if-no-files-found: warn
