name: Publish desktop updates

on:
  workflow_dispatch:
    inputs:
      command:
        description: Stage immutable assets or promote the verified version
        required: true
        type: choice
        options:
          - stage
          - promote
          - mirror-rc8-windows
      tag:
        description: Existing GitHub Draft tag, for example v1.0.0-rc.1
        required: true
        type: string
      scope:
        description: Asset scope used by the verified Draft
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-arm64
      confirm_version:
        description: Required for promote; enter the exact version without v
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: desktop-update-publish
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.command }} ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate trusted invocation
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          TAG: ${{ inputs.tag }}
          SCOPE: ${{ inputs.scope }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo '::error::Desktop update publishing is restricted to refs/heads/main.'
            exit 1
          }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo '::error::Release tag is invalid.'
            exit 1
          }
          if [ "$SCOPE" != 'all' ] && [ "$SCOPE" != 'macos-arm64' ]; then
            echo '::error::Release scope is invalid.'
            exit 1
          fi
          if [ "$SCOPE" != 'all' ] && [[ "$TAG" != *-rc.* ]]; then
            echo '::error::Partial release scopes are allowed for Candidate releases only.'
            exit 1
          fi
          if [ "$COMMAND" = 'mirror-rc8-windows' ]; then
            test "$TAG" = 'v1.0.0-rc.8' || {
              echo '::error::The temporary mirror action is fixed to v1.0.0-rc.8.'
              exit 1
            }
            test "$SCOPE" = 'all' || {
              echo '::error::The temporary mirror action requires scope=all.'
              exit 1
            }
            test -z "$CONFIRM_VERSION" || {
              echo '::error::confirm_version must be empty for the temporary mirror action.'
              exit 1
            }
          elif [ "$COMMAND" = 'stage' ]; then
            test -z "$CONFIRM_VERSION" || {
              echo '::error::confirm_version must be empty for stage.'
              exit 1
            }
          else
            test -n "$CONFIRM_VERSION" || {
              echo '::error::confirm_version is required for promote.'
              exit 1
            }
          fi
      - run: npm ci --ignore-scripts
      - name: Verify publisher contracts
        run: |
          set -euo pipefail
          node scripts/verify-publish-workflow.mjs \
            .github/workflows/publish-update.yml \
            scripts/github-oss-client.mjs
          node --check scripts/github-oss-client.mjs
          node --check scripts/publish-update-to-oss.mjs
      - name: Download RC8 Windows Candidate artifact
        if: inputs.command == 'mirror-rc8-windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: mirrored-artifact
          github-token: ${{ github.token }}
          run-id: '34577246247'
      - name: Publish verified update assets
        if: inputs.command != 'mirror-rc8-windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ inputs.command }}
          TAG: ${{ inputs.tag }}
          SCOPE: ${{ inputs.scope }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          args=(node scripts/publish-update-to-oss.mjs "$COMMAND" --tag "$TAG" --scope "$SCOPE")
          if [ "$COMMAND" = 'promote' ]; then
            args+=(--confirm-version "$CONFIRM_VERSION")
          fi
          "${args[@]}"
      - name: Mirror RC8 Windows Candidate to OSS download prefix
        if: inputs.command == 'mirror-rc8-windows'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { mkdir, readFile, readdir, stat, writeFile } from 'node:fs/promises'
          import { join, resolve } from 'node:path'
          import { createGithubOssClient } from './scripts/github-oss-client.mjs'

          const directory = resolve('mirrored-artifact')
          const prefix = 'desktop/downloads/v1.0.0-rc.8/windows-x64/'
          const expectedNames = [
            'insight-1.0.0-rc.8-windows-x64-setup.exe',
            'insight-1.0.0-rc.8-windows-x64-setup.exe.blockmap',
            'latest.yml'
          ].sort()
          const names = (await readdir(directory)).sort()
          if (JSON.stringify(names) !== JSON.stringify(expectedNames)) {
            throw new Error('RC8 Windows artifact contains an unexpected file set.')
          }

          const files = []
          for (const name of names) {
            const path = join(directory, name)
            const metadata = await stat(path)
            if (!metadata.isFile() || metadata.size <= 0) {
              throw new Error(`RC8 Windows artifact is invalid: ${name}`)
            }
            const sha256 = createHash('sha256').update(await readFile(path)).digest('hex')
            files.push({ name, path, size: metadata.size, sha256 })
          }

          const oss = createGithubOssClient()
          const existing = await oss.listObjects(prefix)
          if (existing.length === 0) {
            for (const file of files) {
              const headers = {
                'x-oss-forbid-overwrite': 'true',
                'cache-control': 'public,max-age=31536000,immutable',
                'content-type': file.name.endsWith('.yml')
                  ? 'application/yaml; charset=utf-8'
                  : 'application/octet-stream'
              }
              if (file.name.endsWith('.exe')) {
                headers['content-disposition'] = `attachment; filename="${file.name}"`
              }
              await oss.putObject(`${prefix}${file.name}`, file.path, headers)
            }
          }

          const uploaded = (await oss.listObjects(prefix))
            .map(({ key, size }) => ({ name: key.slice(prefix.length), size }))
            .sort((left, right) => left.name.localeCompare(right.name))
          const expected = files
            .map(({ name, size }) => ({ name, size }))
            .sort((left, right) => left.name.localeCompare(right.name))
          if (JSON.stringify(uploaded) !== JSON.stringify(expected)) {
            throw new Error('OSS RC8 mirror does not match the Actions artifact.')
          }

          await mkdir('release-reports', { recursive: true })
          const report = {
            action: 'mirror-actions-artifact',
            sourceRunId: '34577246247',
            sourceArtifact: 'windows-x64',
            version: '1.0.0-rc.8',
            ossPrefix: prefix,
            currentJsonModified: false,
            files: files.map(({ name, size, sha256 }) => ({ name, size, sha256 })),
            completedAt: new Date().toISOString()
          }
          await writeFile(
            'release-reports/v1.0.0-rc.8-mirror-actions-artifact.json',
            `${JSON.stringify(report, null, 2)}\n`,
            { mode: 0o600 }
          )
          console.log(JSON.stringify({ ok: true, ...report }, null, 2))
          NODE
      - name: Upload publisher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-${{ inputs.tag }}-${{ inputs.command }}
          path: release-reports/
          if-no-files-found: warn
          retention-days: 90
