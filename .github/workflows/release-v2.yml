name: Build desktop v2 target

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final semantic version, for example 1.0.1
        required: true
        type: string
      target:
        description: One platform target to build and append to the immutable Draft
        required: true
        type: choice
        options:
          - darwin-arm64
          - darwin-x64
          - win32-x64

permissions:
  contents: write

concurrency:
  group: desktop-release-v2-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  initialize:
    name: Pin release source and Draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify source and workflow contracts
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          node scripts/verify-release-v2-workflow.mjs .github/workflows/release-v2.yml
          node --check scripts/prepare-update-v2-draft.mjs
          node --check scripts/upload-update-v2-target.mjs
      - name: Create or verify immutable Tag and Draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/prepare-update-v2-draft.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GH_TOKEN" \
            --package package.json \
            --public-key build/update-signing-public.pem \
            --floor-url https://updates.insight-aigc.com/desktop/stable/current.json \
            --floor-url https://updates.insight-aigc.com/desktop/candidate/current.json \
            --floor-url https://updates.insight-aigc.com/desktop/candidate-v2/darwin-arm64/current.json \
            --floor-url https://updates.insight-aigc.com/desktop/candidate-v2/darwin-x64/current.json \
            --floor-url https://updates.insight-aigc.com/desktop/candidate-v2/win32-x64/current.json

  darwin-arm64:
    name: Build macOS Apple Silicon target
    needs: initialize
    if: inputs.target == 'darwin-arm64'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Apple release credentials
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed Apple Silicon package
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          CSC_NAME: ${{ steps.signing_keychain.outputs.identity }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          npm run package:release:mac:arm64
      - name: Test prepared Runtime
        run: npm test
      - name: Certify and verify Apple Silicon distribution
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app_path='dist/mac-arm64/因赛AI.app'
          base="insight-$RELEASE_VERSION-mac-arm64"
          dmg_path="dist/$base.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk -v team="$APPLE_TEAM_ID" '$0 ~ /Developer ID Application/ && $0 ~ "\\(" team "\\)" { print $2; exit }')"
          test -n "$identity"
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --no-s3-acceleration
          xcrun stapler staple "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"
          unzip -t "dist/$base.zip"
          node scripts/verify-packaged-update-config.mjs "$app_path/Contents/Resources"
          node scripts/verify-macos-distribution.mjs "$app_path"
          mkdir release-assets
          cp "$dmg_path" "dist/$base.zip" "dist/$base.zip.blockmap" release-assets/
          cp dist/latest-mac.yml release-assets/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: release-v2-darwin-arm64
          path: release-assets/
          if-no-files-found: error
      - name: Remove Apple signing files
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do test -z "$keychain" || keychains+=("$keychain"); done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || true
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "${APPLE_API_KEY:-}" || rm -f "$APPLE_API_KEY"
          test -z "$SIGNING_KEYCHAIN_LIST" || rm -f "$SIGNING_KEYCHAIN_LIST"

  darwin-x64:
    name: Build macOS Intel target
    needs: initialize
    if: inputs.target == 'darwin-x64'
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Apple release credentials
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed Intel package
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          CSC_NAME: ${{ steps.signing_keychain.outputs.identity }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          npm run package:release:mac:x64
      - name: Test prepared Runtime
        run: npm test
      - name: Certify and verify Intel distribution
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app_path='dist/mac/因赛AI.app'
          base="insight-$RELEASE_VERSION-mac-x64"
          dmg_path="dist/$base.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk -v team="$APPLE_TEAM_ID" '$0 ~ /Developer ID Application/ && $0 ~ "\\(" team "\\)" { print $2; exit }')"
          test -n "$identity"
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --no-s3-acceleration
          xcrun stapler staple "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"
          unzip -t "dist/$base.zip"
          node scripts/verify-packaged-update-config.mjs "$app_path/Contents/Resources"
          node scripts/verify-macos-distribution.mjs "$app_path"
          mkdir release-assets
          cp "$dmg_path" "dist/$base.zip" "dist/$base.zip.blockmap" release-assets/
          cp dist/latest-mac.yml release-assets/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: release-v2-darwin-x64
          path: release-assets/
          if-no-files-found: error
      - name: Remove Apple signing files
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do test -z "$keychain" || keychains+=("$keychain"); done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || true
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "${APPLE_API_KEY:-}" || rm -f "$APPLE_API_KEY"
          test -z "$SIGNING_KEYCHAIN_LIST" || rm -f "$SIGNING_KEYCHAIN_LIST"

  win32-x64:
    name: Build Windows x64 target
    needs: initialize
    if: inputs.target == 'win32-x64'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and verify Windows package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run package:release:win
          $installer = "insight-$($env:RELEASE_VERSION)-windows-x64-setup.exe"
          $appExecutable = 'dist/win-unpacked/因赛AI.exe'
          node scripts/verify-packaged-update-config.mjs 'dist/win-unpacked/resources'
          node scripts/finalize-windows-release.mjs dist $env:RELEASE_VERSION $appExecutable
          7z t (Join-Path dist $installer)
          if ($LASTEXITCODE -ne 0) { throw '7z rejected the Windows installer.' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item (Join-Path dist $installer) release-assets
          Copy-Item (Join-Path dist "$installer.blockmap") release-assets
          Copy-Item (Join-Path dist 'latest.yml') release-assets
      - name: Test prepared Runtime
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: release-v2-win32-x64
          path: release-assets/
          if-no-files-found: error

  append-draft:
    name: Sign target manifest and append immutable Draft assets
    needs:
      - initialize
      - darwin-arm64
      - darwin-x64
      - win32-x64
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      (
        (inputs.target == 'darwin-arm64' && needs.darwin-arm64.result == 'success') ||
        (inputs.target == 'darwin-x64' && needs.darwin-x64.result == 'success') ||
        (inputs.target == 'win32-x64' && needs.win32-x64.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-v2-${{ inputs.target }}
          path: release-assets
      - name: Prepare product update signing key
        env:
          DESKTOP_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_UPDATE_SIGNING_PRIVATE_KEY"
          key_path="$RUNNER_TEMP/update-signing-private.pem"
          umask 077
          printf '%s' "$DESKTOP_UPDATE_SIGNING_PRIVATE_KEY" > "$key_path"
          echo "UPDATE_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build and verify signed target manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          shell_commit="$(git rev-parse HEAD)"
          node --input-type=module - "$RUNNER_TEMP/release-runtime-manifest.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const output = process.argv[2]
          const lock = JSON.parse(await readFile('core-runtime.lock.json', 'utf8'))
          const commits = new Set(Object.values(lock.targets).map((target) => target.core.commit))
          if (commits.size !== 1) throw new Error('Core Runtime targets do not use one Core commit.')
          await writeFile(output, `${JSON.stringify({
            core: { releaseTag: lock.releaseTag, commit: [...commits][0] }
          }, null, 2)}\n`)
          NODE
          node scripts/build-update-v2-target.mjs \
            --asset-dir release-assets \
            --out-dir target-assets \
            --version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" \
            --shell-commit "$shell_commit" \
            --runtime-manifest "$RUNNER_TEMP/release-runtime-manifest.json" \
            --compatibility build/update-compatibility.json \
            --private-key "$UPDATE_SIGNING_PRIVATE_KEY"
          node scripts/verify-update-v2-assets.mjs \
            --dir target-assets \
            --version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" \
            --public-key build/update-signing-public.pem
      - name: Verify Draft and append target-prefixed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node scripts/upload-update-v2-target.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GH_TOKEN" \
            --tag "v$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" \
            --dir target-assets
      - name: Remove product update signing key
        if: always()
        run: test -z "${UPDATE_SIGNING_PRIVATE_KEY:-}" || rm -f "$UPDATE_SIGNING_PRIVATE_KEY"
