name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Candidate tag, for example v0.1.2-rc.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      runtime_tag: ${{ steps.release.outputs.runtime_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate release identity, policy, and Runtime lock
        id: release
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            release_tag="$CANDIDATE_TAG"
            expected_channel='candidate'
            if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
              echo "::error::Candidate tag $release_tag already exists; choose a new version."
              exit 1
            fi
          else
            release_tag="$GITHUB_REF_NAME"
            expected_channel='stable'
          fi
          node scripts/verify-release-preflight.mjs \
            --tag "$release_tag" \
            --expected-channel "$expected_channel" \
            --package package.json \
            --policy build/update-release-policy.json \
            --runtime-lock core-runtime.lock.json \
            > "$RUNNER_TEMP/release-preflight.json"
          cat "$RUNNER_TEMP/release-preflight.json"
          node --input-type=module - "$RUNNER_TEMP/release-preflight.json" "$GITHUB_OUTPUT" <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          const [input, output] = process.argv.slice(2)
          const release = JSON.parse(await readFile(input, 'utf8'))
          await appendFile(output, [
            `tag=${release.tag}`,
            `version=${release.version}`,
            `channel=${release.channel}`,
            `runtime_tag=${release.runtimeTag}`,
            ''
          ].join('\n'))
          NODE
      - name: Run release configuration tests
        run: >-
          npx vitest run
          test/release-preflight.test.ts
          test/build-update-release.test.ts
          test/merge-mac-update-metadata.test.ts
          test/verify-release-assets.test.ts
          test/finalize-windows-release.test.ts
          test/release.test.ts

  macos-apple-silicon:
    name: macOS Apple Silicon
    needs: release-preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Apple release secrets
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed Apple Silicon package
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          RELEASE_CHANNEL: ${{ needs.release-preflight.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = 'candidate' ]; then
            npm run package:candidate:mac:arm64
            echo 'RELEASE_DIR=dist-candidate' >> "$GITHUB_ENV"
            echo 'RELEASE_APP=dist-candidate/mac-arm64/因赛AI Candidate.app' >> "$GITHUB_ENV"
            echo 'RELEASE_BASENAME=insight-candidate-mac-arm64' >> "$GITHUB_ENV"
          else
            npm run package:mac:arm64
            echo 'RELEASE_DIR=dist' >> "$GITHUB_ENV"
            echo 'RELEASE_APP=dist/mac-arm64/因赛AI.app' >> "$GITHUB_ENV"
            echo 'RELEASE_BASENAME=insight-mac-arm64' >> "$GITHUB_ENV"
          fi
      - name: Sign, notarize, and staple Apple Silicon DMG
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          set -euo pipefail
          dmg_path="$RELEASE_DIR/$RELEASE_BASENAME.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk -v team="$APPLE_TEAM_ID" '$0 ~ /Developer ID Application/ && $0 ~ "\\(" team "\\)" { print $2; exit }')"
          test -n "$identity" || { echo "::error::Developer ID Application identity for Team $APPLE_TEAM_ID not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --no-s3-acceleration
          xcrun stapler staple "$dmg_path"
      - name: Verify Apple Silicon release inputs
        run: |
          set -euo pipefail
          dmg_path="$RELEASE_DIR/$RELEASE_BASENAME.dmg"
          zip_path="$RELEASE_DIR/$RELEASE_BASENAME.zip"
          codesign --verify --deep --strict --verbose=2 "$RELEASE_APP"
          spctl --assess --type execute --verbose=4 "$RELEASE_APP"
          xcrun stapler validate "$RELEASE_APP"
          codesign --verify --verbose=2 "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"
          unzip -t "$zip_path"
          test -s "$zip_path.blockmap"
          test -s "$RELEASE_DIR/latest-mac.yml"
      - name: Collect Apple Silicon release inputs
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "$RELEASE_DIR/$RELEASE_BASENAME.dmg" release-assets/
          cp "$RELEASE_DIR/$RELEASE_BASENAME.zip" release-assets/
          cp "$RELEASE_DIR/$RELEASE_BASENAME.zip.blockmap" release-assets/
          cp "$RELEASE_DIR/latest-mac.yml" release-assets/latest-mac-arm64.yml
      - uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon
          path: release-assets/
          if-no-files-found: error
      - name: Remove Apple signing files
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "${APPLE_API_KEY:-}" || rm -f "$APPLE_API_KEY"

  macos-intel:
    name: macOS Intel
    needs: release-preflight
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Apple release secrets
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed Intel package
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          RELEASE_CHANNEL: ${{ needs.release-preflight.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = 'candidate' ]; then
            npm run package:candidate:mac:x64
            echo 'RELEASE_DIR=dist-candidate' >> "$GITHUB_ENV"
            echo 'RELEASE_APP=dist-candidate/mac/因赛AI Candidate.app' >> "$GITHUB_ENV"
            echo 'RELEASE_BASENAME=insight-candidate-mac-x64' >> "$GITHUB_ENV"
          else
            npm run package:mac:x64
            echo 'RELEASE_DIR=dist' >> "$GITHUB_ENV"
            echo 'RELEASE_APP=dist/mac/因赛AI.app' >> "$GITHUB_ENV"
            echo 'RELEASE_BASENAME=insight-mac-x64' >> "$GITHUB_ENV"
          fi
      - name: Sign, notarize, and staple Intel DMG
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          set -euo pipefail
          dmg_path="$RELEASE_DIR/$RELEASE_BASENAME.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk -v team="$APPLE_TEAM_ID" '$0 ~ /Developer ID Application/ && $0 ~ "\\(" team "\\)" { print $2; exit }')"
          test -n "$identity" || { echo "::error::Developer ID Application identity for Team $APPLE_TEAM_ID not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --no-s3-acceleration
          xcrun stapler staple "$dmg_path"
      - name: Verify Intel release inputs
        run: |
          set -euo pipefail
          dmg_path="$RELEASE_DIR/$RELEASE_BASENAME.dmg"
          zip_path="$RELEASE_DIR/$RELEASE_BASENAME.zip"
          codesign --verify --deep --strict --verbose=2 "$RELEASE_APP"
          spctl --assess --type execute --verbose=4 "$RELEASE_APP"
          xcrun stapler validate "$RELEASE_APP"
          codesign --verify --verbose=2 "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"
          unzip -t "$zip_path"
          test -s "$zip_path.blockmap"
          test -s "$RELEASE_DIR/latest-mac.yml"
      - name: Collect Intel release inputs
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "$RELEASE_DIR/$RELEASE_BASENAME.dmg" release-assets/
          cp "$RELEASE_DIR/$RELEASE_BASENAME.zip" release-assets/
          cp "$RELEASE_DIR/$RELEASE_BASENAME.zip.blockmap" release-assets/
          cp "$RELEASE_DIR/latest-mac.yml" release-assets/latest-mac-x64.yml
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: release-assets/
          if-no-files-found: error
      - name: Remove Apple signing files
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "${APPLE_API_KEY:-}" || rm -f "$APPLE_API_KEY"

  windows-x64:
    name: Windows x64 unsigned
    needs: release-preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unsigned Windows package
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ needs.release-preflight.outputs.channel }}
          RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          if ($env:RELEASE_CHANNEL -eq 'candidate') {
            npm run package:candidate:win
            $releaseDir = 'dist-candidate'
            $installer = 'insight-candidate-windows-x64-setup.exe'
          } else {
            npm run package:win
            $releaseDir = 'dist'
            $installer = 'insight-windows-x64-setup.exe'
          }
          node scripts/finalize-windows-release.mjs $releaseDir $env:RELEASE_VERSION
          $installerPath = Join-Path $releaseDir $installer
          7z t $installerPath
          if ($LASTEXITCODE -ne 0) { throw '7z rejected the Windows installer.' }
          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Collect Windows release inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item (Join-Path $env:RELEASE_DIR $env:RELEASE_INSTALLER) release-assets
          Copy-Item (Join-Path $env:RELEASE_DIR "$($env:RELEASE_INSTALLER).blockmap") release-assets
          Copy-Item (Join-Path $env:RELEASE_DIR 'latest.yml') release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish verified GitHub Release
    needs:
      - release-preflight
      - macos-apple-silicon
      - macos-intel
      - windows-x64
    if: >-
      always() &&
      needs.release-preflight.result == 'success' &&
      needs.macos-apple-silicon.result == 'success' &&
      needs.macos-intel.result == 'success' &&
      needs.windows-x64.result == 'success'
    runs-on: ubuntu-24.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: macos-apple-silicon
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: macos-intel
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - name: Merge macOS update metadata
        run: |
          set -euo pipefail
          node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac.yml
          rm release-assets/latest-mac-arm64.yml release-assets/latest-mac-x64.yml
      - name: Prepare product update signing key
        env:
          DESKTOP_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_UPDATE_SIGNING_PRIVATE_KEY" || {
            echo '::error::Missing desktop-release Environment secret: DESKTOP_UPDATE_SIGNING_PRIVATE_KEY'
            exit 1
          }
          key_path="$RUNNER_TEMP/update-signing-private.pem"
          umask 077
          printf '%s' "$DESKTOP_UPDATE_SIGNING_PRIVATE_KEY" > "$key_path"
          echo "UPDATE_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build and verify authenticated release manifest
        env:
          RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.release-preflight.outputs.channel }}
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/release-runtime-manifest.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const output = process.argv[2]
          const lock = JSON.parse(await readFile('core-runtime.lock.json', 'utf8'))
          const commits = new Set(Object.values(lock.targets).map((target) => target.core.commit))
          if (commits.size !== 1) throw new Error('Core Runtime targets do not use one Core commit.')
          await writeFile(output, `${JSON.stringify({
            core: { releaseTag: lock.releaseTag, commit: [...commits][0] }
          }, null, 2)}\n`)
          NODE
          node scripts/build-update-release.mjs \
            --dir release-assets \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --shell-commit "$GITHUB_SHA" \
            --runtime-manifest "$RUNNER_TEMP/release-runtime-manifest.json" \
            --compatibility build/update-compatibility.json \
            --policy build/update-release-policy.json \
            --private-key "$UPDATE_SIGNING_PRIVATE_KEY"
          node scripts/verify-release-assets.mjs \
            --dir release-assets \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --public-key build/update-signing-public.pem
      - name: Create immutable draft Release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.release-preflight.outputs.channel }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; create a new version instead of replacing assets."
            exit 1
          fi
          create_args=(--draft --generate-notes --title "因赛AI $RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
          if [ "$RELEASE_CHANNEL" = 'candidate' ]; then
            create_args+=(--prerelease --target "$GITHUB_SHA")
          else
            create_args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "${create_args[@]}"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          if [ "$RELEASE_CHANNEL" = 'candidate' ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
      - name: Remove product update signing key
        if: always()
        run: |
          test -z "${UPDATE_SIGNING_PRIVATE_KEY:-}" || rm -f "$UPDATE_SIGNING_PRIVATE_KEY"
